{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <div><div class="h1">Add Team</div></div>
  <div><a class="btn btn-ghost" href="{{ url_for('teams_view') }}">Cancel</a></div>
</div>

<div class="card">
  <form method="POST" class="form">
    <div class="form-row">
      <div class="form-field" style="flex:1">
        <label>Name</label>
        <input type="text" name="name" required />
      </div>
      <div class="form-field" style="width:160px">
        <label>Short</label>
        <input type="text" name="short_name" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label>City</label>
        <input type="text" name="city" />
      </div>
      <div class="form-field">
        <label>Coach</label>
        <input type="text" name="coach" />
      </div>
    </div>

    <!-- 🔹 Assign players to this team (optional) -->
    <div class="form-row">
      <div class="form-field" style="flex:1">
        <label>Assign Players (optional)</label>
        <select name="player_ids" multiple size="6" style="width:100%; min-height:140px;">
          {% for p in players %}
            <option value="{{ p.id }}">
              {{ p.first_name }} {{ p.last_name or '' }} ({{ p.position or 'No position' }})
            </option>
          {% endfor %}
        </select>
        <small style="color:var(--muted);">
          Hold Ctrl (Windows) or Cmd (Mac) to select multiple players.
        </small>
      </div>
    </div>

    <div style="margin-top:12px">
      <button class="btn btn-primary" type="submit">Create Team</button>
    </div>
  </form>
</div>
{% endblock %}
