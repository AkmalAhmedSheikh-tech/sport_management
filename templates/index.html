{% extends 'base.html' %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
  <div class="container-fluid py-5">
    <h1 class="display-5 fw-bold">Welcome to Sports League Manager</h1>
    <p class="col-md-8 fs-5">
      Manage teams, players, fixtures, match results & tournament stats — all in one place.
    </p>
    {% if not current_user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="/register">Get Started</a>
    {% else %}
      <a class="btn btn-success btn-lg" href="/dashboard">Go to Dashboard</a>
    {% endif %}
  </div>
</div>
{% endblock %}
